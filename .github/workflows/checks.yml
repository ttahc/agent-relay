name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Builds dist/ once, then runs every verify*.py / verify*.js except the 24h soak.
      - name: Run all checks
        run: python -B run_checks.py --output "$RUNNER_TEMP/checks"
      - name: Keep logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/checks
          retention-days: 7
