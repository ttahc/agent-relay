<title>任务池界面原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: slim left rail + work area; views for work, board, list, projects, feedback, windows, activity, accounts; task opens in a right-side panel (full screen on phones). */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --sunken: #e9edf3; --line: #dbe1ea;
  --fg: #1a2231; --muted: #5d6879; --accent: #2b59c3; --accent-soft: #e3eafa; --on-accent: #ffffff;
  --s-draft: #7b8597; --s-open: #1f86c8; --s-doing: #b57a06; --s-review: #7456c4; --s-rework: #cc4f35; --s-done: #2b8a57; --s-cancel: #8a8f99;
  --shadow: 0 1px 2px #1a22311a, 0 4px 14px #1a22310f;
  --font-body: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161e; --surface: #1a202b; --sunken: #232a37; --line: #2e3646;
  --fg: #e4e9f2; --muted: #98a3b6; --accent: #7a9cf0; --accent-soft: #24304d; --on-accent: #0e1420;
  --s-draft: #8d97a8; --s-open: #4fb0ea; --s-doing: #e0a93a; --s-review: #a68af0; --s-rework: #f07a60; --s-done: #4fc283; --s-cancel: #7d8494;
  --shadow: 0 1px 2px #0006, 0 6px 18px #0005; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161e; --surface: #1a202b; --sunken: #232a37; --line: #2e3646;
  --fg: #e4e9f2; --muted: #98a3b6; --accent: #7a9cf0; --accent-soft: #24304d; --on-accent: #0e1420;
  --s-draft: #8d97a8; --s-open: #4fb0ea; --s-doing: #e0a93a; --s-review: #a68af0; --s-rework: #f07a60; --s-done: #4fc283; --s-cancel: #7d8494;
  --shadow: 0 1px 2px #0006, 0 6px 18px #0005; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .01em; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.app { display: grid; grid-template-columns: 196px 1fr; height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px 8px 14px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); font-style: normal; font-size: 12px; }
.rail button { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 7px 10px; border-radius: 7px; text-align: left; color: var(--muted); }
.rail button:hover { background: var(--sunken); color: var(--fg); }
.rail button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count { font-size: 12px; background: var(--s-rework); color: #fff; border-radius: 99px; padding: 0 7px; min-width: 20px; text-align: center; font-weight: 600; }
.rail .sep { height: 1px; background: var(--line); margin: 10px 6px; flex: none; }
.rail .who { margin-top: auto; display: grid; gap: 4px; padding: 8px; }
.rail .who label { font-size: 12px; color: var(--muted); }
.rail select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.top h1 { font-size: 18px; margin-right: 6px; }
.search { flex: 1 1 280px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 5px; color: var(--muted); font-size: 16px; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--s-rework); border-color: var(--s-rework); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-align: left; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 20px; font-size: 13px; color: var(--muted); }
.toolbar select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
button.chip[aria-pressed="true"], .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.strong { border-color: var(--s-review); color: var(--s-review); background: color-mix(in srgb, var(--s-review) 12%, transparent); }
.chip .x { border: 0; background: none; padding: 0 0 0 2px; color: inherit; }
.hint { margin-left: auto; font-size: 12px; }
.hint code { font-family: var(--font-mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; }

.view { flex: 1; overflow: auto; padding: 4px 20px 24px; padding-right: max(20px, env(safe-area-inset-right, 0px)); min-height: 0; }

/* Board */
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 10px; min-width: 1360px; }
.lane-title { grid-column: 1 / -1; font-weight: 600; font-size: 13px; padding: 10px 2px 2px; display: flex; gap: 8px; align-items: center; }
.colhead { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 4px 6px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.colhead .dot { width: 9px; height: 9px; border-radius: 50%; }
.colhead .n { color: var(--muted); font-weight: 400; }
.colhead .wip { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; }
.colhead .wip.over { color: var(--s-rework); font-weight: 600; }
.col { background: var(--sunken); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 90px; transition: background .12s; }
.col.drop-ok { background: var(--accent-soft); outline: 2px dashed var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 6px; text-align: left; width: 100%; }
.card:hover { border-color: var(--accent); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .4; }
.card .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .t { font-weight: 600; line-height: 1.35; }
.card .id { color: var(--muted); }
.flag { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--sunken); color: var(--muted); }
.flag.warn { background: color-mix(in srgb, var(--s-rework) 14%, transparent); color: var(--s-rework); }
.tag { font-size: 11px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted); }
.tag.v { border-color: var(--s-review); color: var(--s-review); }
.av { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.av b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; color: #fff; font-weight: 600; flex: none; }
.av b.ai { border-radius: 5px; }
.av.off { text-decoration: line-through; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

/* Tables */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--sunken); }
th[data-sort] { cursor: pointer; user-select: none; }
tbody tr[data-open] { cursor: pointer; }
tbody tr[data-open]:hover { background: var(--accent-soft); }
td.title { white-space: normal; font-weight: 600; min-width: 220px; }
td.wrap { white-space: normal; min-width: 160px; }
td select, td input[type=text] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
td input[type=text] { width: 100%; min-width: 180px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.off-row td { opacity: .55; }
.st-on { color: var(--s-done); font-weight: 600; font-size: 12px; }
.st-off { color: var(--s-rework); font-weight: 600; font-size: 12px; }
.ops { display: flex; gap: 6px; flex-wrap: wrap; }

/* My work */
.mine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.mine section { display: grid; gap: 8px; }
.mine h2 { font-size: 14px; display: flex; gap: 8px; align-items: baseline; padding: 6px 2px; }
.mine h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.mine .why { font-size: 12px; color: var(--accent); }
.mine .why.no { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; }

/* Generic page blocks */
.page { display: grid; gap: 16px; max-width: 1080px; }
.phead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.phead h2 { font-size: 20px; }
.phead .seg, .phead .right { margin-left: auto; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.box h3 { font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ovgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.form { display: grid; gap: 14px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 13px; font-weight: 600; }
.f > span em { color: var(--s-rework); font-style: normal; }
.form input[type=text], .form input[type=password], .form input[type=number], .form textarea, .form select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.form textarea { min-height: 64px; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips input { width: 150px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.radios { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.radios label { display: flex; gap: 5px; align-items: center; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addrow select, .addrow input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); min-width: 0; }
.small { font-size: 12px; color: var(--muted); }

/* Projects */
.projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; text-align: left; }
button.proj:hover { border-color: var(--accent); }
.proj h2 { font-size: 16px; }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunken); }
.stack span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.avs { display: flex; gap: 3px; flex-wrap: wrap; }
.recent { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
.recent li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.recent .when { color: var(--muted); font-size: 12px; margin-left: auto; }

/* Windows */
.wins { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.win { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.win .head { display: flex; justify-content: space-between; align-items: center; }
.online { font-size: 12px; color: var(--s-done); }
.online.off { color: var(--muted); }
.win h4 { font-size: 13px; margin-bottom: 4px; }
.win ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.report { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--sunken); }
.caps li { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.badge { font-size: 11px; border-radius: 4px; padding: 0 6px; font-weight: 600; white-space: nowrap; }
.badge.ok { color: var(--s-done); background: color-mix(in srgb, var(--s-done) 14%, transparent); }
.badge.dec { color: var(--muted); background: var(--sunken); }
.badge.warn { color: var(--s-rework); background: color-mix(in srgb, var(--s-rework) 14%, transparent); }
.badge.mid { color: var(--s-doing); background: color-mix(in srgb, var(--s-doing) 14%, transparent); }
.badge.info { color: var(--s-open); background: color-mix(in srgb, var(--s-open) 14%, transparent); }
.caps .basis { font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.capadd { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
.capadd select, .capadd input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); min-width: 0; }

/* Accounts */
.secret { display: grid; gap: 8px; border: 1px solid var(--s-doing); background: color-mix(in srgb, var(--s-doing) 10%, var(--surface)); border-radius: 10px; padding: 14px; }
.codebox { font-family: var(--font-mono); font-size: 12px; background: var(--sunken); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.matrix td:not(:first-child), .matrix th:not(:first-child) { text-align: center; }
.matrix .y { color: var(--s-done); font-weight: 700; }
.matrix .n { color: var(--muted); }

/* Panel */
.scrim { position: fixed; inset: 0; background: #0b101a55; z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--surface); z-index: 21; box-shadow: -8px 0 30px #0003; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.panel header { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel header .x { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--muted); }
.pbody { overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) 236px; align-items: start; }
.pmain { padding: 18px; display: grid; gap: 18px; min-width: 0; }
.pmain h2 { font-size: 20px; line-height: 1.35; }
.pmain h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.pmain .brief { white-space: pre-wrap; }
.crit { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.crit li { display: flex; gap: 8px; align-items: flex-start; }
.crit li::before { content: "□"; color: var(--muted); }
.crit li.ok::before { content: "✓"; color: var(--s-done); font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; border-radius: 10px; background: var(--sunken); }
.actions .note { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.actform { display: grid; gap: 8px; flex-basis: 100%; }
.actform textarea, .actform input[type=text], .actform select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.actform textarea { min-height: 64px; resize: vertical; }
.actform label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.manage { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.callout { border-left: 3px solid var(--s-doing); background: color-mix(in srgb, var(--s-doing) 9%, transparent); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 13px; display: grid; gap: 4px; }
.files { display: grid; gap: 6px; }
.file { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.rev { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.rev.cur { border-color: var(--accent); }
.rels { display: grid; gap: 4px; font-size: 13px; }
.timeline { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; border-left: 2px solid var(--line); padding-left: 14px; }
.timeline li { position: relative; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline .when { color: var(--muted); font-size: 12px; }
.comment { display: flex; gap: 8px; }
.comment input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.tech { font-size: 12px; color: var(--muted); }
details.tech summary { cursor: pointer; }
details.tech dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 0; }
details.tech dd { margin: 0; overflow-wrap: anywhere; }
.side { border-left: 1px solid var(--line); padding: 18px 16px; display: grid; gap: 14px; background: var(--bg); align-self: stretch; align-content: start; }
.field { display: grid; gap: 3px; }
.field > span { font-size: 12px; color: var(--muted); }
.field .tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* Popover + modal */
.pop { position: fixed; z-index: 31; top: calc(58px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100% - 32px)); max-height: 70%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px #0004; padding: 12px; display: grid; gap: 6px; }
.pop .item { border: 0; background: none; text-align: left; padding: 8px; border-radius: 8px; display: grid; gap: 2px; font-size: 13px; }
.pop .item:hover { background: var(--sunken); }
.pop .item.unread { background: var(--accent-soft); }
.modal { position: fixed; z-index: 31; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px #0005; padding: 20px; display: grid; gap: 14px; }
.modal h2 { font-size: 18px; }
.modal details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.modal details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.modal details[open] { display: grid; gap: 12px; }
.modal footer { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.modal footer label { margin-right: auto; font-size: 13px; display: flex; gap: 6px; align-items: center; }

/* Notes */
.notes { display: grid; gap: 14px; max-width: 1040px; }
.notes .tablewrap table { min-width: 720px; }
.notes td { white-space: normal; vertical-align: top; }
.notes p { max-width: 72ch; color: var(--muted); }
.notes h2 { font-size: 16px; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

function canClaim(t, w) {
  if (t.status !== "open") return [false, ""];
  if (!PEOPLE[w].active) return [false, "你的账号已停用"];
  if (t.paused) return [false, "任务已暂停"];
  const role = roleIn(w, t.project);
  if (!role) return [false, `你不是「${pname(t.project)}」的成员`];
  if (!DOERS.includes(role)) return [false, `你在该项目是${role}，不能领取任务`];
  if (t.receiver === w) return [false, "你是本任务的验收人，不能同时执行"];
  if (t.mode === "限定" && !targetHit(t, w)) return [false, `仅限 ${targetText(t)} 领取`];
  const blocked = t.deps.find(d => (task(d) || {}).status !== "done");
  if (blocked) return [false, `需等 ${blocked} 完成`];
  for (const r of t.req) {
    const c = capOf(w, r.tag);
    if (!c) return [false, `缺少能力「${r.tag}」，可在「我的账号」或 AI 窗口页申报`];
    if (r.verify && c.status !== "已核实") return [false, `「${r.tag}」要求已核实，你目前是已申报`];
  }
  return [true, t.mode === "优先" && !targetHit(t, w) ? `优先通知了 ${targetText(t)}，你也可以领` : ""];
}
function notifyClaimable(t, why) {
  const p = pj(t.project);
  const list = Object.keys(p.members).filter(n => canClaim(t, n)[0] && (t.mode === "公开" || targetHit(t, n)));
  list.forEach(n => notify(n, `${t.id} ${why}`, t.id));
}
function move(t, to, w, extra = {}) {
  const from = t.status;
  if (t.cancelWait) { toast("任务取消中，等执行人确认停止"); return false; }
  if (t.resumeNeeded && to !== "open") { toast("先点「继续执行」"); return false; }
  if (t.paused && !["open", "draft"].includes(from) && to !== "open") { toast("任务已暂停，先由项目管理员恢复"); return false; }
  const reclaim = () => isPAdmin(w, t.project) && t.assignee && !PEOPLE[t.assignee].active;
  const rule = {
    "draft>open": () => isPAdmin(w, t.project) || "只有项目管理员可以开放任务",
    "open>doing": () => { const [ok, why] = canClaim(t, w); return ok || why; },
    "doing>open": () => t.assignee === w || reclaim() || "只有当前执行人可以放回",
    "rework>open": () => reclaim() || "只有项目管理员可以收回停用账号的任务",
    "doing>review": () => t.assignee === w || "只有当前执行人可以交付",
    "rework>review": () => t.assignee === w || "只有当前执行人可以重新交付",
    "review>done": () => t.receiver !== w ? "只有本任务的验收人可以验收" : t.assignee === w ? "执行人不能验收自己的交付" : true,
    "review>rework": () => t.receiver === w || "只有本任务的验收人可以退回",
    "rework>doing": () => t.assignee === w || "只有当前执行人可以继续"
  }[from + ">" + to];
  const ok = rule ? rule() : `不能从「${S[from].n}」直接到「${S[to].n}」`;
  if (ok !== true) { toast(ok); return false; }
  const rev = t.revs.length + 1;
  const verb = { "draft>open": "开放领取", "open>doing": "领取任务", "doing>open": "放回任务池", "rework>open": "收回到任务池", "doing>review": `上传交付（修订 ${rev}）`, "rework>review": `重新交付（修订 ${rev}）`, "review>done": "验收通过并归档", "review>rework": `退回修订 ${t.revs.length}`, "rework>doing": "开始返修" }[from + ">" + to];
  t.log.push([w, verb + (extra.note ? "：" + extra.note : ""), now()]);
  if (to === "review") t.revs.push({ n: rev, files: extra.files, at: now(), by: w });
  if (to === "doing" && from === "open") { t.assignee = w; notify(t.receiver, `${w} 领取了 ${t.id}`, t.id); }
  if (to === "review") notify(t.receiver, `${t.id} 已交付修订 ${rev}，等你验收`, t.id);
  if (to === "rework") notify(t.assignee, `${t.id} 被退回${extra.note ? "：" + extra.note : ""}`, t.id);
  if (to === "done") {
    notify(t.assignee, `${t.id} 验收通过`, t.id);
    T.filter(x => x.deps.includes(t.id) && live(x)).forEach(x => admins(x.project).forEach(a => notify(a, `${t.id} 已完成，${x.id} 的前置条件已满足`, x.id)));
    FB.filter(f => f.toTask === t.id).forEach(f => admins(f.project).forEach(a => notify(a, `反馈 ${f.id} 对应的 ${t.id} 已完成，请复核效果`, null)));
  }
  if (to === "open") { if (from !== "draft") t.handoff = { by: t.assignee, note: extra.note || "", at: now() }; t.assignee = null; }
  t.status = to; if (to !== "rework") delete t.flag;
  if (to === "open") notifyClaimable(t, from === "draft" ? "已开放，可以领取" : "已放回任务池，附交接说明");
  followers(t).filter(x => x !== w).forEach(x => notify(x, `${t.id} ${verb.split("，")[0]}（${w}）`, t.id));
  toast(`${t.id} ${verb.split("，")[0]}`);
  render(); return true;
}

/* ================= search ================= */
function matches(t) {
  if (st.proj !== "全部" && t.project !== st.proj) return false;
  if (st.chip === "我的" && ![t.assignee, t.receiver, t.owner, ...t.watchers].includes(me())) return false;
  for (const tok of st.q.trim().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^(状态|执行|接收|验收|负责|项目|标签)[:：](.+)$/);
    if (m) {
      const v = m[2];
      const hit = { 状态: S[t.status].n.includes(v), 执行: (t.assignee || "未领取").includes(v), 接收: t.receiver.includes(v), 验收: t.receiver.includes(v), 负责: t.owner.includes(v), 项目: pname(t.project).includes(v), 标签: t.req.some(x => x.tag.includes(v)) }[m[1]];
      if (!hit) return false;
    } else if (!(t.id + t.title).toLowerCase().includes(tok.toLowerCase())) return false;
  }
  return true;
}

function card(t, drag) {
  const flags = [];
  if (t.cancelWait) flags.push(`<span class="flag warn">取消中，待确认停止</span>`);
  if (t.paused) flags.push(`<span class="flag warn">${t.pauseWait ? "暂停中，待确认停止" : "已暂停"}</span>`);
  if (t.flag) flags.push(`<span class="flag warn">${esc(t.flag)}</span>`);
  if (t.assignee && !PEOPLE[t.assignee].active) flags.push(`<span class="flag warn">执行账号已停用</span>`);
  if (t.mode !== "公开") flags.push(`<span class="flag">${t.mode}：${esc(targetText(t))}</span>`);
  if (t.deps.length) flags.push(`<span class="flag">依赖 ${esc(t.deps.join("、"))}</span>`);
  if (t.handoff && t.status === "open") flags.push(`<span class="flag">有交接说明</span>`);
  return `<button class="card" data-open="${t.id}" ${drag ? `draggable="true" data-drag="${t.id}"` : ""}>
    <div class="row"><span class="mono id">${t.id}</span>${st.proj === "全部" ? `<span class="small">${esc(pname(t.project))}</span>` : ""}${flags.join("")}</div>
    <div class="t">${esc(t.title)}</div>
    ${t.req.length ? `<div class="row">${t.req.map(reqTag).join("")}</div>` : ""}
    <div class="foot">${avatar(t.assignee)}<span class="small">${t.revs.length ? `修订 ${t.revs.length} · ` : ""}验收 ${esc(t.receiver)}</span></div>
  </button>`;
}

function todo(w) {
  return T.filter(t =>
    (t.status === "review" && t.receiver === w && t.assignee !== w) ||
    (t.status === "rework" && t.assignee === w) ||
    (t.status === "draft" && isPAdmin(w, t.project)) ||
    ((t.status === "doing" || t.status === "rework") && t.assignee && !PEOPLE[t.assignee].active && isPAdmin(w, t.project)));
}
const fbTodo = w => FB.filter(f => isPAdmin(w, f.project) && (f.status === "待评估" || fbState(f) === "待复核"));

/* ================= views ================= */
function renderToolbar() {
  const tb = $("#toolbar");
  const chips = ["全部", "我的"].map(x => `<button class="chip" data-chip="${x}" aria-pressed="${st.chip === x}">${x}</button>`).join("");
  if (st.view === "board") {
    tb.innerHTML = `<span>分组</span><select id="lane" aria-label="分组">${["无", "项目", "执行人"].map(x => `<option ${x === st.lane ? "selected" : ""}>${x}</option>`).join("")}</select>${chips}
      <button class="btn sm" data-export>导出看板</button><span class="hint">拖动卡片改状态 · 规则不允许时会说明原因 · 已取消的任务在列表里</span>`;
  } else if (st.view === "list") {
    tb.innerHTML = `${chips}<span class="hint">点表头排序 · 搜索支持 <code>状态:</code> <code>执行:</code> <code>验收:</code> <code>项目:</code> <code>标签:</code></span>`;
  } else tb.innerHTML = "";
  tb.hidden = !tb.innerHTML;
}

function renderBoard() {
  const list = T.filter(live).filter(matches);
  const lanes = st.lane === "无" ? [["", list]] :
    st.lane === "项目" ? PROJ.map(p => [p.name, list.filter(t => t.project === p.id)]) :
    [...new Set(list.map(t => t.assignee || "未领取"))].map(a => [a, list.filter(t => (t.assignee || "未领取") === a)]);
  const wipLimit = st.proj !== "全部" ? pj(st.proj).wip : 0;
  let h = `<div class="board">` + STATES.map(s => {
    const n = list.filter(t => t.status === s.k).length;
    const wip = s.k === "doing" && wipLimit ? `<span class="wip ${n > wipLimit ? "over" : ""}">上限 ${wipLimit}</span>` : "";
    return `<div class="colhead"><span class="dot" style="background:var(${s.c})"></span>${s.n}<span class="n">${n}</span>${wip}</div>`;
  }).join("");
  for (const [name, items] of lanes) {
    if (name) h += `<div class="lane-title">${st.lane === "执行人" && name !== "未领取" ? avatar(name) : esc(name)}<span class="small">${items.length} 项</span></div>`;
    h += STATES.map(s => `<div class="col" data-col="${s.k}">${items.filter(t => t.status === s.k).map(t => card(t, true)).join("")}</div>`).join("");
  }
  return h + `</div>`;
}

function renderList() {
  const key = st.sort;
  const order = [...STATES.map(s => s.k), "cancelled"];
  const val = (t, k) => k === "project" ? pname(t.project) : t[k] || "";
  const list = T.filter(matches).sort((a, b) => key === "status" ? order.indexOf(a.status) - order.indexOf(b.status) : String(val(a, key)).localeCompare(String(val(b, key)), "zh"));
  const th = (k, n) => `<th data-sort="${k}">${n}${st.sort === k ? " ↓" : ""}</th>`;
  return `<div class="tablewrap"><table><thead><tr>${th("id", "编号")}${th("title", "标题")}${th("status", "状态")}${th("assignee", "执行")}${th("receiver", "验收")}${th("project", "项目")}<th>最近动态</th></tr></thead><tbody>
    ${list.map(t => { const l = t.log[t.log.length - 1]; return `<tr data-open="${t.id}"><td class="mono">${t.id}</td><td class="title">${esc(t.title)}${t.paused ? ` <span class="flag warn">已暂停</span>` : ""}</td><td>${pill(t.status)}</td><td>${avatar(t.assignee)}</td><td>${esc(t.receiver)}</td><td>${esc(pname(t.project))}</td><td class="small">${esc(l[0])} ${esc(l[1].split("：")[0])} · ${l[2]}</td></tr>`; }).join("") || `<tr><td colspan="7" class="small">没有符合条件的任务。</td></tr>`}
  </tbody></table></div>`;
}

function renderMine() {
  const w = me();
  const a = todo(w).filter(matches);
  const b = T.filter(t => t.status === "doing" && t.assignee === w).filter(matches);
  const openInMine = T.filter(t => t.status === "open" && canDo(w, t.project) && t.receiver !== w).filter(matches);
  const owned = T.filter(t => t.owner === w && !["done", "cancelled"].includes(t.status)).filter(matches);
  const c = openInMine.filter(t => canClaim(t, w)[0]);
  const near = openInMine.filter(t => !canClaim(t, w)[0]);
  const fb = fbTodo(w);
  const why = t => t.assignee && !PEOPLE[t.assignee].active && t.assignee !== w ? "执行账号已停用，等你收回" : t.status === "review" ? "等你验收" : t.status === "rework" ? "被退回，等你修改" : "草稿，等你开放";
  const item = (t, note, cls = "") => `<div>${note ? `<div class="why ${cls}">${esc(note)}</div>` : ""}${card(t, false)}</div>`;
  const ex = execAnywhere(w);
  const banner = !PEOPLE[w].active ? `<p class="empty" style="grid-column:1/-1">这个账号已停用，只能查看，不能领取或提交。</p>` : "";
  return `<div class="mine">${banner}
    <section><h2>待我处理<small>${a.length + fb.length} 项</small></h2>${a.map(t => item(t, why(t))).join("")}
      ${fb.map(f => `<div><div class="why">${f.status === "待评估" ? "反馈待评估" : "改进已完成，待复核效果"}</div><button class="card" data-gofb="${f.id}"><div class="row"><span class="mono id">${f.id}</span><span class="flag">${f.kind}</span></div><div class="t">${esc(f.title)}</div><div class="foot">${avatar(f.by)}<span class="small">${esc(pname(f.project))}</span></div></button></div>`).join("")}
      ${a.length + fb.length ? "" : `<p class="empty">没有等你处理的事。</p>`}</section>
    <section><h2>我在做的<small>${b.length} 项</small></h2>${b.map(t => item(t)).join("") || `<p class="empty">${ex ? "你手上没有进行中的任务。" : "你在各项目里是报告者或观察者，不领取任务。"}</p>`}
      <h2>我负责跟进的<small>${owned.length} 项</small></h2>${owned.map(t => item(t, `${S[t.status].n}${t.assignee ? " · " + t.assignee + " 执行" : ""}`, "no")).join("") || `<p class="empty">没有你负责跟进的未完成任务。</p>`}</section>
    <section><h2>可以领的<small>${c.length} 项</small></h2>${c.map(t => item(t, canClaim(t, w)[1])).join("") || `<p class="empty">${ex ? "暂时没有你能领的任务。" : "你在各项目里是报告者或观察者，不领取任务。"}</p>`}
      ${near.length ? `<h2>暂时领不了<small>${near.length} 项</small></h2>${near.map(t => item(t, canClaim(t, w)[1], "no")).join("")}` : ""}</section>
  </div>`;
}

/* ---- projects ---- */

  if (st.pv && pj(st.pv)) return renderProject(pj(st.pv));

  return `<div class="page">

    <div class="projgrid">${visible.map(p => {
      const ts = T.filter(t => t.project === p.id && live(t));

      return `<button class="proj" data-pv="${p.id}">
        <div class="phead"><h2>${esc(p.name)}</h2>${mine ? `<span class="chip on">我是${mine.role}</span>` : ""}</div>

}

    </div>`;
  } else {

      </div>
      <label class="f"><span>说明</span><textarea id="pDesc" ${dis}>${esc(p.desc)}</textarea></label>

/* ---- feedback (C05) ---- */
function fbState(f) {
  if (f.status !== "已纳入") return f.status;
  const t = task(f.toTask);
  if (!t || t.status === "cancelled") return "不采纳";
  if (t.status === "done") return f.result ? "已完成" : "待复核";
  return ["draft", "open"].includes(t.status) ? "已纳入" : "处理中";
}
const fbBadge = s => `<span class="badge ${{ 待评估: "mid", 已纳入: "info", 处理中: "info", 待复核: "mid", 已完成: "ok", 不采纳: "dec", 重复: "dec" }[s]}">${s}</span>`;
function renderFeedback() {
  const w = me();
  const mine = PROJ.filter(p => PEOPLE[w].sys || p.members[w]);
  const list = FB.filter(f => mine.some(p => p.id === f.project));
  const writable = mine.filter(p => canWrite(w, p.id));
  return `<div class="page">
    <p class="small" style="max-width:72ch">报告者以上的成员（包括 AI 窗口）都可以记录问题和建议，观察者只能查看。项目管理员评估后，可以转成任务、标记重复或不采纳。转成的任务完成后，回到这里写下实际改善了什么，作为下一轮的依据。</p>
    ${writable.length ? `<form class="box form" id="fbForm"><h3>记录反馈</h3>
      <div class="radios">${["问题", "建议", "使用反馈"].map((k, i) => `<label><input type="radio" name="fbk" value="${k}" ${i ? "" : "checked"}> ${k}</label>`).join("")}</div>
      <div class="two"><label class="f"><span>标题 <em>*</em></span><input type="text" id="fbTitle" required placeholder="一句话说明"></label>
        <label class="f"><span>项目</span><select id="fbProj">${writable.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label></div>
      <label class="f"><span>现象和影响 <em>*</em></span><textarea id="fbDetail" required placeholder="看到了什么、影响了谁、怎么复现；有截图或任务编号也写上"></textarea></label>
      <div class="addrow"><label class="small" for="fbTask">关联任务</label><select id="fbTask"><option value="">无</option>${T.map(t => `<option>${t.id}</option>`).join("")}</select><button class="btn primary">提交</button></div>
    </form>` : `<p class="empty">你在所属项目里是观察者，只能查看反馈。</p>`}
    <div class="tablewrap"><table><thead><tr><th>编号</th><th>类型</th><th>标题</th><th>提出</th><th>关联</th><th>状态</th><th>处理</th></tr></thead><tbody>
    ${list.map(f => {
      const s = fbState(f); const adm = isPAdmin(w, f.project);
      let ops = "";
      if (adm && s === "待评估") ops = `<div class="ops"><button class="btn sm primary" data-fbtask="${f.id}">转为任务</button><select data-fbdup="${f.id}" aria-label="标记重复"><option value="">标记为重复…</option>${FB.filter(x => x.id !== f.id && !x.dup).map(x => `<option>${x.id}</option>`).join("")}</select><button class="btn sm" data-fbno="${f.id}">不采纳</button></div>`;
      else if (adm && s === "待复核") ops = `<div class="ops"><input type="text" id="fbr-${f.id}" placeholder="实际改善了什么、还剩什么" aria-label="复核结果"><button class="btn sm primary" data-fbres="${f.id}">记录复核</button></div>`;
      else if (f.result) ops = `<span class="small">${esc(f.result)}</span>`;
      const rel = [f.task ? `<button class="link mono" data-open="${f.task}">${f.task}</button>` : "", f.toTask ? `→ <button class="link mono" data-open="${f.toTask}">${f.toTask}</button>` : "", f.dup ? `重复于 ${f.dup}` : ""].filter(Boolean).join(" ");
      return `<tr id="fb-${f.id}"><td class="mono">${f.id}</td><td>${f.kind}</td><td class="wrap"><b>${esc(f.title)}</b><div class="small">${esc(f.detail)}</div></td><td>${avatar(f.by)}<div class="small">${f.at}</div></td><td class="small">${rel || "—"}</td><td>${fbBadge(s)}</td><td class="wrap">${ops || (adm ? "" : `<span class="small">由项目管理员处理</span>`)}</td></tr>`;

function actionsFor(t) {
  const w = me(); const out = []; const form = st.form;
  if (!PEOPLE[w].active) return `<span class="note">你的账号已停用，只能查看。</span>`;
  if (t.status === "cancelled") return `<span class="note">任务已取消。</span>`;
  if (t.cancelWait) return t.assignee === w || (!PEOPLE[t.assignee].active && isPAdmin(w, t.project)) ? `<button class="btn primary" data-act="stop-confirm">确认已停止</button><span class="note">任务正在取消，确认工作已停止后才会归档。</span>` : `<span class="note">任务正在取消，等 ${esc(t.assignee)} 确认已停止。</span>`;
  if (t.pauseWait && t.assignee === w) out.push(`<button class="btn primary" data-act="stop-confirm">确认已停止</button>`);
  if (t.resumeNeeded && t.assignee === w) out.push(`<button class="btn primary" data-act="continue">继续执行</button>`);
  if (t.paused) out.push(`<span class="note">任务已暂停${isPAdmin(w, t.project) ? "，可以在下方「管理」里恢复" : "，暂时不能领取或提交"}。</span>`);

    if (!PEOPLE[t.assignee].active && isPAdmin(w, t.project)) out.push(`<button class="btn" data-act="reclaim">收回到任务池</button><span class="note">${esc(t.assignee)} 的账号已停用。收回后其他贡献者可以接手，已有修订和动态都会保留。</span>`);

      else out.push(`<button class="btn primary" data-act="accept">验收通过</button><button class="btn danger" data-act="reject">退回修改</button><span class="note">通过后直接归档。执行人已在交付时声明执行结束。</span>`);

function act(a) {
  const t = task(st.open); if (!t) return;
  const note = () => ($("#note") || {}).value?.trim() || "";
  const forms = ["deliver", "release", "reject", "accept", "edit", "cancelTask", "pause", "relate", "split"];
  if (forms.includes(a)) { st.form = a; renderPanel(); return; }
  if (a === "cancel") { st.form = null; renderPanel(); return; }
  if (a === "open") move(t, "open", me());
  else if (a === "claim") move(t, "doing", me());
  else if (a === "deliver-go") {
    const files = [...($("#up").files || [])].map(f => f.name);
    if (!files.length) { toast("请先选择要交付的文件"); return; }
    if (!$("#stopDecl").checked) { toast("请先确认本次执行已结束"); return; }
    st.form = null; move(t, "review", me(), { files, note: "执行人声明本次执行已结束" + (note() ? "，" + note() : "") });
  }
  else if (a === "release-go") { if (!note()) { toast("请写交接说明，方便下一位接手"); return; } st.form = null; move(t, "open", me(), { note: note() }); }
  else if (a === "accept-go") {
    if (t.criteria.some((c, i) => !$("#ac" + i).checked)) { toast("还有判据没有勾选"); return; }
    st.form = null; move(t, "done", me(), { note: `逐项核对 ${t.criteria.length} 条判据${note() ? "，" + note() : ""}` });
  }
  else if (a === "reject-go") {
    const bad = t.criteria.filter((c, i) => $("#rc" + i)?.checked);
    if (!bad.length) { toast("请勾选至少一条未通过的判据"); return; }
    st.form = null; move(t, "rework", me(), { note: `未通过「${bad.join("」「")}」${note() ? "，" + note() : ""}` });
  }
  else if (a === "reclaim") move(t, "open", me(), { note: `${t.assignee} 的账号已停用，由项目管理员收回` });
  else if (a === "edit-go") {
    const criteria = $("#eCrit").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (!$("#eTitle").value.trim() || !$("#eBrief").value.trim() || !criteria.length) { toast("标题、说明和判据都不能为空"); return; }
    const id = "T" + String(++seq).padStart(2, "0");
    T.unshift({ ...structuredClone(t), id, title: $("#eTitle").value.trim(), brief: $("#eBrief").value.trim(), criteria, status: "draft", assignee: null, revs: [], handoff: null, paused: false, rel: [...t.rel, { type: "重建自", id: t.id }], log: [[me(), `从 ${t.id} 重建`, now()]] });
    t.log.push([me(), `取消并重建为 ${id}`, now()]); t.status = "cancelled"; st.form = null; st.open = id; toast(`已取消 ${t.id}，新草稿 ${id}`); render();
  }
  else if (a === "cancel-go") {
    if (!note()) { toast("请写取消原因"); return; }
    t.paused = false; t.pauseWait = false; t.resumeNeeded = false; st.form = null;
    if (t.status === "doing" && t.assignee) { t.cancelWait = true; t.log.push([me(), "请求取消：" + note(), now()]); notify(t.assignee, `${t.id} 请求取消，请停止工作并确认：${note()}`, t.id); toast(`${t.id} 取消中，等执行人确认停止`); }
    else { t.log.push([me(), "取消：" + note(), now()]); t.status = "cancelled"; if (t.assignee) notify(t.assignee, `${t.id} 已取消：${note()}`, t.id); toast(`${t.id} 已取消`); }
    render();
  }
  else if (a === "pause-go") { t.paused = true; t.log.push([me(), "暂停" + (note() ? "：" + note() : ""), now()]); if (t.status === "doing" && t.assignee) { t.pauseWait = true; notify(t.assignee, `${t.id} 已暂停，请停止工作并确认`, t.id); } st.form = null; render(); }
  else if (a === "resume") { if (t.pauseWait) { toast("等执行人确认停止后才能恢复"); return; } t.paused = false; if (t.status === "doing" && t.assignee) t.resumeNeeded = true; t.log.push([me(), "恢复", now()]); if (t.assignee) notify(t.assignee, `${t.id} 已恢复，可以继续`, t.id); render(); }
  else if (a === "stop-confirm") { if (t.cancelWait) { t.cancelWait = false; t.status = "cancelled"; t.log.push([me(), "确认已停止，任务取消", now()]); toast(`${t.id} 已取消`); } else { t.pauseWait = false; t.log.push([me(), "确认已停止", now()]); toast("已确认停止"); } admins(t.project).forEach(x => x !== me() && notify(x, `${t.id} 的执行已确认停止`, t.id)); render(); }
  else if (a === "continue") { t.resumeNeeded = false; t.log.push([me(), "继续执行", now()]); render(); }
  else if (a === "relate-go") {
    const type = $("#rType").value, id = $("#rTask").value;
    if (type === "前置任务") { if (task(id).deps.includes(t.id)) { toast(`${id} 已依赖本任务，不能形成循环`); return; } t.deps.push(id); }
    else t.rel.push({ type, id });
    t.log.push([me(), `添加关联：${type} ${id}`, now()]); task(id).log.push([me(), `${t.id} 标记与本任务「${type}」`, now()]);
    if (type === "重复于") { t.status = "cancelled"; if (t.assignee) notify(t.assignee, `${t.id} 与 ${id} 重复，已取消`, t.id); }
    st.form = null; render();
  }
  else if (a === "split-go") {
    const titles = note().split("\n").map(s => s.trim()).filter(Boolean);
    if (!titles.length) { toast("每行写一个子任务标题"); return; }
    titles.forEach(title => { const id = "T" + String(++seq).padStart(2, "0"); T.unshift({ ...structuredClone(t), id, title, status: "draft", assignee: null, revs: [], rel: [{ type: "拆分自", id: t.id }], handoff: null, paused: false, log: [[me(), `从 ${t.id} 拆分`, now()]] }); });
    t.log.push([me(), `拆分出 ${titles.length} 个子任务`, now()]); st.form = null; toast(`已拆分出 ${titles.length} 个草稿`); render();
  }
  else if (a === "watch") { const i = t.watchers.indexOf(me()); if (i < 0) t.watchers.push(me()); else t.watchers.splice(i, 1); toast(i < 0 ? `已关注 ${t.id}` : `已取消关注 ${t.id}`); renderPanel(); }
  else if (a === "comment") { const v = $("#cm").value.trim(); if (!v) return; t.log.push([me(), "评论：" + v, now()]); [...new Set([t.assignee, t.receiver, ...followers(t)])].filter(x => x && x !== me()).forEach(x => notify(x, `${me()} 在 ${t.id} 评论：${v}`, t.id)); renderPanel(); }
}

function fbToTask(fid) {
  const f = FB.find(x => x.id === fid);
  st.open = null; st.form = null; st.fb = f.id;
  renderNew({ pid: f.project, title: f.title, brief: `${f.detail}\n（来自反馈 ${f.id}）`, crit: "" });
  toast("补全完成判据后创建任务");
}
function redeem(code) {
  const i = INVITES.find(x => x.code === code);
  let name;
  if (i.kind === "AI") { const pre = PREFIX[i.platform]; const n = Object.keys(PEOPLE).filter(k => k.startsWith(pre)).length + 1; name = `${pre}-${String(n).padStart(4, "0")}`; PEOPLE[name] = { kind: "AI", color: "#6b7fa8", platform: i.platform, owner: i.owner, online: true, where: "新登记窗口", auto: "仅通知", active: true, report: { s: "空闲", note: "刚完成登记", at: now() } }; }
  else { name = `member-${Object.keys(PEOPLE).length + 1}`; PEOPLE[name] = { kind: "人员", color: "#5b8a7a", active: true }; }
  CAPS[name] = []; SEEN[name] = now(); pj(i.project).members[name] = { role: i.role, duty: "", labels: [] }; i.used = name;
  notify(i.by, `邀请 ${i.code} 已被使用，新账号 ${name}`);
  toast(`模拟注册完成：${name} 加入 ${pname(i.project)}，可以在左下角切换到这个身份`); render();
}
function exportBoard() {
  const md = PROJ.map(p => `## ${p.name}\n\n` + STATES.map(s => { const ts = T.filter(t => t.project === p.id && t.status === s.k); return ts.length ? `### ${s.n}\n` + ts.map(t => `- ${t.id} ${t.title}（执行 ${t.assignee || "未领取"}，验收 ${t.receiver}）`).join("\n") : ""; }).filter(Boolean).join("\n\n")).join("\n\n");
  $("#layer").innerHTML = `<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="导出看板"><h2>导出看板（Markdown）</h2><div class="codebox" id="mdOut">${esc("# 任务看板 " + now() + "\n\n" + md)}</div><footer><button class="btn" data-close>关闭</button><button class="btn primary" data-copy="mdOut">复制</button></footer></div>`;
}

document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "projForm") {
    const p = pj(st.pv);
    p.name = $("#pName").value.trim() || p.name; p.owner = $("#pOwner").value; p.desc = $("#pDesc").value.trim();
    p.receiver = $("#pRecv").value; p.wip = Math.max(0, +$("#pWip").value || 0); p.autoOpen = $("#pAuto").checked;
    toast("项目设置已保存"); render(); return;
  }
  if (id === "pwForm") { if (!$("#pw0").value) { toast("请输入当前密码"); return; } toast("密码已修改，其他设备上的会话需要重新登录"); $("#pw0").value = $("#pw1").value = ""; return; }
  if (id === "invForm") {
    const ai = st.ikind === "AI"; const d = new Date(Date.now() + 864e5);
    const inv = { code: `INV-${rand(4)}-${rand(4)}`, kind: st.ikind, platform: ai ? $("#iPlat").value : null, owner: ai ? $("#iOwner").value : null, project: $("#iProj").value, role: $("#iRole").value, by: me(), at: now(), expires: `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`, used: null, revoked: false };
    INVITES.unshift(inv); st.lastInvite = inv; toast("邀请已生成"); render(); return;
  }
  if (id === "fbForm") {
    const f = { id: "F" + String(++fseq).padStart(2, "0"), kind: document.querySelector('input[name="fbk"]:checked').value, title: $("#fbTitle").value.trim(), detail: $("#fbDetail").value.trim(), by: me(), at: now(), project: $("#fbProj").value, task: $("#fbTask").value || null, status: "待评估", toTask: null, dup: null, result: "" };
    FB.unshift(f); admins(f.project).forEach(a => a !== me() && notify(a, `新反馈 ${f.id}：${f.title}`)); toast(`${f.id} 已提交，等项目管理员评估`); render(); return;
  }
  if (id !== "newForm") return;
  if (!$("#nRecv").value) { toast("该项目还没有贡献者可以验收，请先在项目成员里添加"); return; }
  const tid = "T" + String(++seq).padStart(2, "0");
  const pid = $("#nProj").value;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const dep = $("#nDep").value;
  const openNow = $("#nOpen").checked && isPAdmin(me(), pid);
  const req = [...document.querySelectorAll("[data-tag]")].filter(b => +b.dataset.lv > 0).map(b => ({ tag: b.dataset.tag, verify: b.dataset.lv === "2" }));
  const t = { id: tid, title: $("#nTitle").value.trim(), project: pid, status: "draft", assignee: null, owner: $("#nOwner").value, watchers: [], receiver: $("#nRecv").value,
    req, mode, target: mode === "公开" ? [] : [$("#nTarget").value], inputs: [...($("#nFiles").files || [])].map(f => f.name), revs: [], rel: [],
    brief: $("#nBrief").value.trim(), criteria: $("#nCrit").value.split("\n").map(s => s.trim()).filter(Boolean), deps: dep ? [dep] : [],
    log: [[me(), "创建任务", now()]] };
  T.unshift(t);
  if (st.fb) { const f = FB.find(x => x.id === st.fb); f.status = "已纳入"; f.toTask = tid; t.rel.push({ type: "来自反馈", id: f.id }); t.watchers.push(f.by); t.log[0][1] = `由反馈 ${f.id} 转为任务`; notify(f.by, `你的反馈 ${f.id} 已转为任务 ${tid}`, tid); st.fb = null; }
  $("#layer").innerHTML = "";
  if (openNow) move(t, "open", me());
  else { admins(pid).forEach(a => a !== me() && notify(a, `${me()} 新建了草稿 ${tid}，等你开放`, tid)); toast(`${tid} 已保存为草稿，等项目管理员开放`); render(); }
});

/* drag and drop on the board */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest("[data-drag]"); if (!c) return; dragId = c.dataset.drag; c.classList.add("dragging"); e.dataTransfer.setData("text/plain", dragId); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.drop-ok").forEach(x => x.classList.remove("dragging", "drop-ok")); });
document.addEventListener("dragover", e => {
  const col = e.target.closest("[data-col]"); if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".drop-ok").forEach(x => x !== col && x.classList.remove("drop-ok"));
  col.classList.add("drop-ok");
});
document.addEventListener("drop", e => {
  const col = e.target.closest("[data-col]"); if (!col || !dragId) return;
  e.preventDefault();
  const t = task(dragId); const to = col.dataset.col;
  if (to === t.status) return;
  const pre = to === "review" ? "deliver" : to === "rework" && t.status === "review" ? "reject" : to === "done" && t.status === "review" ? "accept" : to === "open" && t.status === "doing" && t.assignee === me() ? "release" : null;
  if (pre) {
    const allowed = { deliver: t.assignee === me() && !t.paused, reject: t.receiver === me() && t.assignee !== me(), accept: t.receiver === me() && t.assignee !== me(), release: !t.paused }[pre];
    if (!allowed) { move(t, to, me()); return; }
    st.open = t.id; st.form = pre; renderPanel(); toast({ deliver: "选择交付文件后提交", reject: "勾选未通过的判据后退回", accept: "逐条核对判据后通过", release: "写交接说明后放回" }[pre]);
    return;
  }
  move(t, to, me());
});

render();
</script>
